# Açar sözlər. Uyğunluq böyük/kiçik hərfə həssas deyil, söz sərhədləri nəzərə alınır.
# Hər element title + xülasə mətnində axtarılır.
#
# Xüsusi hərflər fərq etmir: "vəkil" həm də "vekil" yazılışını, "Bakı" həm də "Baki" yazılışını tutur.
# Söz * ilə bitirsə, şəkilçili formalar da tutulur: адвокат* → адвоката, адвокату; vəkil* → vəkilə, vəkillər.
# Kök qısa və ümumidirsə * qoymayın: Bakı* türkcə "bakım", "bakır" sözlərini də tutar.
#
# geo:        "Azərbaycanla bağlıdır" şərti. require_geo: true olan mənbələrdə ən azı biri lazımdır.
# categories: mesajın kateqoriyası və filtr. Ən azı bir kateqoriya sözü (və ya /addkw ilə əlavə edilən söz) lazımdır.
# exclude:    bunlardan biri varsa, element atılır (səs-küyü azaltmaq üçün).
# weak:       ümumi sözlər. Tək başına lid sayılmır: ya güclü söz də olmalıdır, ya da ən azı iki söz.

