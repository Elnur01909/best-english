# Mənbələr. Hər biri müstəqil yoxlanır; biri xəta versə, qalanları işləyir.
#
# Sahələr:
#   id             unikal qısa ad (Telegram-da /mute <id> üçün)
#   name           insan üçün ad
#   type           gnews | rss | html_links | tg_channel | reliefweb_jobs
#   category       company | individual | job | tender | dispute | other (defolt kateqoriya)
#   categories     bu mənbədə hansı açar söz kateqoriyaları sayılır (səs-küyü azaldır). Yazılmasa: hamısı.
#   require_geo    true → mətndə Azərbaycan/Bakı sözü olmalıdır (keywords.yaml → geo)
#   disable_after  YYYY-MM-DD → bu tarixdən sonra mənbə avtomatik söndürülür
#   enabled        false → yoxlanmır
#   note           qeyd (✅ işləyir, ⚠️ bəzən bloklanır, ❔ /check ilə yoxlayın, ⛔ işləmir)
#
# type-ə görə əlavə sahələr:
#   gnews:          query (Google News axtarış sorğusu), lang (en|az|ru)
#   rss:            url
#   html_links:     url, link_pattern (regex; uyğun gələn <a href> linkləri element sayılır)
#   tg_channel:     channel (ictimai Telegram kanalının adı, @ olmadan). Telegram-da /addtg ilə də əlavə olunur.
#   reliefweb_jobs: (ReliefWeb API v2; təsdiqlənmiş RELIEFWEB_APPNAME tələb edir)

sources:

  # ───────────── ŞİRKƏT LİDLƏRİ (xəbərlər) ─────────────
  - id: gnews_office
    name: "Google News — Bakıda yeni ofis / filial / törəmə"
    type: gnews
    lang: en
    query: 'Azerbaijan ("opens office" OR "new office" OR "representative office" OR subsidiary OR "branch in Baku")'
    category: company
    categories: [company, dispute]
    require_geo: true
    note: "✅ Windows-da işləyir."

  - id: gnews_afez
    name: "Google News — Ələt AİZ / sənaye parkı rezidentləri"
    type: gnews
    lang: en
    query: '"Alat Free Economic Zone" OR "AFEZ" OR "Sumgayit Chemical Industrial Park" OR "Pirallahi Industrial Park" OR "Aghdam Industrial Park"'
    category: company
    categories: [company, dispute]
    require_geo: false
    note: "✅ Yeni xarici rezidentlər — AFEZCO qeydiyyatı, torpaq, EPC, iş icazəsi işi."

  - id: gnews_invest
    name: "Google News — investisiya sazişi / JV / memorandum"
    type: gnews
    lang: en
    query: 'Azerbaijan company ("memorandum of understanding" OR "investment agreement" OR "joint venture" OR "to invest" OR "signed an agreement")'
    category: company
    categories: [company, dispute]
    require_geo: true
    note: "✅ AZPROMO/nazirlik sazişləri, ilk dəfə girən şirkətlər."

  - id: gnews_franchise
    name: "Google News — franşiza və brend açılışları (Bakı)"
    type: gnews
    lang: en
    query: 'Baku (franchise OR "first store" OR "first restaurant" OR "master franchise" OR "opens in Baku")'
    category: company
    categories: [company]
    require_geo: true
    note: "✅ Əmtəə nişanı + franşiza müqaviləsi + icarə işi."

  - id: gnews_dispute
    name: "Google News — arbitraj / mübahisə / lisenziya ləğvi"
    type: gnews
    lang: en
    query: 'Azerbaijan (arbitration OR ICSID OR "license revoked" OR lawsuit OR "Central Bank fined")'
    category: dispute
    categories: [dispute, company]
    require_geo: true
    note: "✅ İri mübahisələr; konflikt yoxlamasından sonra yanaşın."

  - id: gnews_legal_az
    name: "Google News — hüquq bazarı xəbərləri (law firm / legal counsel)"
    type: gnews
    lang: en
    query: 'Azerbaijan ("law firm" OR "legal counsel" OR "legal services" OR lawyers) Baku'
    category: company
    categories: [company, dispute, job]
    require_geo: true
    note: "✅ Rəqib hərəkətləri və müştəri siqnalları."

  - id: trend_rss
    name: "Trend.az — İngiliscə xəbər lenti"
    type: rss
    url: "https://en.trend.az/feeds/index.rss"
    category: company
    categories: [company, dispute, tender]
    require_geo: false
    note: "❔ Google News-dən tez gəlir. /check ilə yoxlayın."

  - id: azernews_rss
    name: "AzerNews — xəbər lenti"
    type: rss
    url: "https://www.azernews.az/feed.php"
    category: company
    categories: [company, dispute, tender]
    require_geo: false
    note: "❔ /check ilə yoxlayın."

  # ───────────── FƏRDİ SORĞULAR (forumlar) ─────────────
  - id: expat_az_forum
    name: "Expat.com — Azerbaijan forumu"
    type: html_links
    url: "https://www.expat.com/en/forum/asia/azerbaijan/"
    link_pattern: "/en/forum/asia/azerbaijan/\\d+-"
    category: individual
    categories: [individual]
    require_geo: false
    note: "✅ Windows-da işləyir. MYİ/biznes sualları buradan gəlir."

  - id: reddit_azerbaijan_new
    name: "Reddit — r/azerbaijan yeni postlar"
    type: rss
    url: "https://www.reddit.com/r/azerbaijan/new.rss?limit=50"
    category: individual
    categories: [individual]
    require_geo: false
    disable_after: "2026-11-12"
    note: "⛔ Reddit RSS lentlərini 13.11.2026-da bağlayır; bot bu tarixdən sonra mənbəni özü söndürür."

  - id: reddit_search_lawyer
    name: "Reddit — bütün Reddit: Azerbaijan + lawyer/visa/permit"
    type: rss
    url: "https://www.reddit.com/search.rss?q=Azerbaijan+%28lawyer+OR+%22legal+advice%22+OR+%22residence+permit%22+OR+%22work+permit%22+OR+deported+OR+%22company+registration%22%29&sort=new&t=month"
    category: individual
    categories: [individual]
    require_geo: true
    disable_after: "2026-11-12"
    note: "⛔ 13.11.2026-da bağlanır."

  - id: tripadvisor_az_forum
    name: "TripAdvisor — Azerbaijan Forum mövzuları"
    type: html_links
    url: "https://www.tripadvisor.com/ShowForum-g293933-i9346-Azerbaijan.html"
    link_pattern: "ShowTopic-g293933-i9346-k\\d+"
    category: individual
    categories: [individual]
    require_geo: false
    enabled: false
    note: "⛔ Botları bloklayır (HTTP 403). Forumu əl ilə izləyin."

  # ───────────── TENDERLƏR / KONSULTANT ÇAĞIRIŞLARI ─────────────
  - id: reliefweb_jobs_az
    name: "ReliefWeb — Azərbaycan üzrə iş/konsultant elanları (RSS)"
    type: rss
    url: "https://reliefweb.int/jobs/rss.xml?search=Azerbaijan"
    category: tender
    categories: [tender, job]
    require_geo: true
    note: "❔ /check ilə yoxlayın."

  - id: reliefweb_api_az
    name: "ReliefWeb API v2 — Azərbaycan iş elanları"
    type: reliefweb_jobs
    category: tender
    categories: [tender, job]
    require_geo: false
    enabled: false
    note: "❔ Təsdiqlənmiş appname lazımdır (apidoc.reliefweb.int). .env → RELIEFWEB_APPNAME, sonra /unmute reliefweb_api_az."

  - id: undp_notices
    name: "UNDP Procurement Notices — son elanlar"
    type: html_links
    url: "https://procurement-notices.undp.org/"
    link_pattern: "view_notice\\.cfm\\?notice_id=\\d+"
    category: tender
    categories: [tender]
    require_geo: true
    note: "✅ İşləyir; Azərbaycan elanı olanda gəlir. UNGM-də vendor qeydiyyatı da tövsiyə olunur."

  # ───────────── İŞ ELANLARI (Bakı) ─────────────
  - id: boss_az_legal
    name: "Boss.az — hüquqşünas vakansiyaları"
    type: html_links
    url: "https://boss.az/vacancies?search%5Bkeyword%5D=h%C3%BCquq"
    link_pattern: "/vacancies/\\d+"
    category: job
    categories: [job]
    require_geo: false
    note: "❔ /sources-da statusa baxın."

  - id: hh_az_legal
    name: "hh.az — legal counsel / lawyer axtarışı"
    type: html_links
    url: "https://hh.az/search/vacancy?text=legal+counsel+OR+lawyer+OR+h%C3%BCquq%C5%9F%C3%BCnas&area=9&order_by=publication_time"
    link_pattern: "/vacancy/\\d+"
    category: job
    categories: [job]
    require_geo: false
    note: "❔ /sources-da statusa baxın."

  - id: hellojob_az
    name: "HelloJob.az — son vakansiyalar (hüquq filtri)"
    type: html_links
    url: "https://www.hellojob.az/"
    link_pattern: "/vakansiya/[a-z0-9-]+"
    category: job
    categories: [job]
    require_geo: false
    note: "❔ Hüquqşünas elanları burada çox olur. /check ilə yoxlayın."

  - id: smartjob_az
    name: "Smartjob.az — son vakansiyalar (hüquq filtri)"
    type: html_links
    url: "https://smartjob.az/"
    link_pattern: "/vacancy/\\d+-"
    category: job
    categories: [job]
    require_geo: false
    note: "❔ /check ilə yoxlayın."

  - id: busy_az
    name: "Busy.az — son vakansiyalar (hüquq filtri)"
    type: html_links
    url: "https://busy.az/"
    link_pattern: "/vacancy/\\d+/"
    category: job
    categories: [job]
    require_geo: false
    note: "❔ /check ilə yoxlayın."

  - id: jobsearch_az_legal
    name: "JobSearch.az — hüquq vakansiyaları"
    type: html_links
    url: "https://www.jobsearch.az/vacancies?q=h%C3%BCquq"
    link_pattern: "/vacancies/\\d+"
    category: job
    categories: [job]
    require_geo: false
    enabled: false
    note: "❔ JavaScript ilə yüklənə bilər. /check --only jobsearch_az_legal ilə sınayın."
